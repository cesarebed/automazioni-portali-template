name: Learnings guard

# Protects the learnings (shared data/learnings.md + per-portal data/learnings/*.md)
# from DELETION of [L-nnn] entries by anyone who is not a maintainer. It does not
# block additions (learnings stay free to push) nor MOVING an entry between files:
# detection works on the UNION of ids across all files, so only an id disappearing
# from the union counts as a deletion. If a push removes an entry and the author is
# not a maintainer, the files are restored to their previous state and an issue is
# opened. Maintainers can delete (sensitive data/duplicates/archiving). The rule is
# documented in CLAUDE.md and data/learnings.md.
#
# Note: pushes made with GITHUB_TOKEN do not re-trigger workflows, so the restore
# cannot loop; the job also explicitly skips the bot actor.

on:
  push:
    branches: [main]
    paths:
      - 'data/learnings.md'
      - 'data/learnings/**'

permissions:
  contents: write
  issues: write

jobs:
  guard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect removed [L-nnn] entries
        id: check
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          # Maintainers ALLOWED to delete learnings: your company's GitHub usernames,
          # space-separated. UPDATE THIS when adopting the template.
          MAINTAINERS: 'cesarebed'
        run: |
          set -euo pipefail
          # initial push of the branch (before is all zeros): nothing to compare
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "violation=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Aggregates [L-nnn] ids across ALL learnings files (shared + per-portal)
          # at a given ref. Moving an entry between files is therefore NOT a deletion
          # (the id stays in the union): only an id vanishing from the union counts.
          ids_at() {
            local ref="$1"
            {
              git show "$ref:data/learnings.md" 2>/dev/null || true
              for f in $(git ls-tree -r --name-only "$ref" -- data/learnings/ 2>/dev/null); do
                git show "$ref:$f" 2>/dev/null || true
              done
            } | grep -oE '\[L-[0-9]+\]' | sort -u
          }
          ids_before=$(ids_at "$BEFORE")
          ids_after=$(ids_at "$AFTER")
          removed=$(comm -23 <(printf '%s\n' "$ids_before") <(printf '%s\n' "$ids_after") | grep -E '\[L-[0-9]+\]' || true)
          if [[ -z "${removed//[[:space:]]/}" ]]; then
            echo "No entries removed."
            echo "violation=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for m in $MAINTAINERS; do
            if [[ "$ACTOR" == "$m" ]]; then
              echo "Entries removed by maintainer @$ACTOR: allowed ($removed)."
              echo "violation=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "VIOLATION: @$ACTOR removed: $removed"
          {
            echo "violation=true"
            echo "removed<<EOF"
            echo "$removed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Restore learnings and notify
        if: steps.check.outputs.violation == 'true'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REMOVED: ${{ steps.check.outputs.removed }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Restore ALL learnings files as they were before the push, so no entry is
          # lost. Legitimate additions in the same push must be redone (without
          # deleting), see the issue. The per-portal directory may not have existed
          # at BEFORE: include it in the checkout only if it did, so the pathspec
          # does not fail.
          git checkout "$BEFORE" -- data/learnings.md
          if git ls-tree -r --name-only "$BEFORE" -- data/learnings/ | grep -q .; then
            git checkout "$BEFORE" -- data/learnings/
          fi
          msg=$(printf 'revert: restore learnings deleted by @%s\n\nEntries removed and restored: %s\nLearnings get superseded by entries citing the old one, not deleted.\nDeletion is reserved to maintainers (sensitive data/duplicates/archiving).' "$ACTOR" "$REMOVED")
          git commit -m "$msg"
          git push origin HEAD:main
          body=$(printf 'Push %s by @%s removed these entries: %s\n\nThey were restored automatically (learnings files, shared and per-portal, reverted to their previous state). If the same push also contained a legitimate change (a new entry, or superseding one by citing it), redo it without deleting existing entries. Only maintainers can delete learnings, and only for sensitive data/duplicates/archiving.' "$AFTER" "$ACTOR" "$REMOVED")
          gh issue create --title "Learnings restored: deletion not allowed for @$ACTOR" --body "$body" || echo "issue not created (permissions?), restore done anyway"
